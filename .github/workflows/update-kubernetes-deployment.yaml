name: Update Kubernetes Deployment Manifests

on:
  workflow_call:
    inputs:
      overlay:
        description: 'Overlay to update (staging or production)'
        required: true
        type: string
      version_tag:
        description: 'Version tag for the deployment'
        required: true
        type: string

jobs:
  update-kubernetes-deployment:
    runs-on: ubuntu-latest
    env:
      K3S_REPO: "pipelinedave/k3s-config"
      VERSION_TAG: ${{ inputs.version_tag }}
      OVERLAY: ${{ inputs.overlay }}
    steps:
      - name: 🔍 Check K3S_CONFIG_TOKEN Availability
        id: check_token
        run: |
          if [ -z "${{ secrets.K3S_CONFIG_TOKEN }}" ]; then
            echo "has_token=false" >> $GITHUB_OUTPUT
            echo "::warning::K3S_CONFIG_TOKEN secret is not configured in this repository. Skipping automatic GitOps update of k3s-config."
          else
            echo "has_token=true" >> $GITHUB_OUTPUT
          fi

      - name: 📥 Clone k3s-config Repo
        if: steps.check_token.outputs.has_token == 'true'
        run: |
          git clone "https://x-access-token:${{ secrets.K3S_CONFIG_TOKEN }}@github.com/${K3S_REPO}.git" k3s-config
          cd k3s-config
          git config user.name "GitHub Actions [bot]"
          git config user.email "actions@github.com"

      - name: 📦 Set up Kustomize
        if: steps.check_token.outputs.has_token == 'true'
        uses: imranismail/setup-kustomize@v2

      - name: 🚀 Update Image Tags in Overlay
        if: steps.check_token.outputs.has_token == 'true'
        run: |
          echo "Updating all choretwo service images in overlay ${OVERLAY} to tag: ${VERSION_TAG}"
          cd k3s-config
          OVERLAY_DIR="kustomize/choretwo/overlays/${OVERLAY}"
          
          if [ -d "$OVERLAY_DIR" ]; then
            cd "$OVERLAY_DIR"
            kustomize edit set image pipelinedave/auth-service=pipelinedave/auth-service:${VERSION_TAG} || true
            kustomize edit set image pipelinedave/chore-service=pipelinedave/chore-service:${VERSION_TAG} || true
            kustomize edit set image pipelinedave/log-service=pipelinedave/log-service:${VERSION_TAG} || true
            kustomize edit set image pipelinedave/notification-service=pipelinedave/notification-service:${VERSION_TAG} || true
            kustomize edit set image pipelinedave/ai-copilot-service=pipelinedave/ai-copilot-service:${VERSION_TAG} || true
            kustomize edit set image pipelinedave/frontend=pipelinedave/frontend:${VERSION_TAG} || true
            cd -
          fi
          
          # Also update any explicit image lines in deployment manifests if present
          find "kustomize/choretwo/overlays/${OVERLAY}/" -name "*.yaml" -type f | while read file; do
            sed -i "s|image: pipelinedave/\([^:]*\):.*|image: pipelinedave/\1:${VERSION_TAG}|g" "$file"
          done

      - name: 💾 Commit & Push to k3s-config
        if: steps.check_token.outputs.has_token == 'true'
        run: |
          cd k3s-config
          git add kustomize/choretwo/
          
          if git diff --cached --quiet; then
            echo "No changes to commit (manifests already match tag ${VERSION_TAG})."
          else
            git commit -m "chore(${OVERLAY}): update choretwo images to ${VERSION_TAG:0:7}"
            git push origin HEAD:main
            echo "Successfully updated and pushed image tags to k3s-config repository"
          fi

          TAG_NAME="choretwo/${OVERLAY}/${{ env.VERSION_TAG }}"
          git tag -f "${TAG_NAME}"
          git push origin -f "${TAG_NAME}" || echo "Tag push completed or skipped"
