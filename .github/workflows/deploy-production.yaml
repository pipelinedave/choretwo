name: Deploy to Production (Manual)

on:
  workflow_dispatch:
    inputs:
      version_tag:
        description: 'Version tag or image tag to deploy'
        required: true
        default: 'latest'

jobs:
  deploy:
    name: Trigger Production Deployment
    uses: ./.github/workflows/update-kubernetes-deployment.yaml
    with:
      overlay: production
      version_tag: ${{ inputs.version_tag }}
    secrets: inherit
