name: Update Kubernetes Deployment Manifests

on:
  workflow_call:
    inputs:
      overlay:
        description: 'Overlay to update (staging or production)'
        required: true
        type: string
      version_tag:
        description: 'Version tag for the deployment'
        required: true
        type: string
    secrets:
      K3S_CONFIG_TOKEN:
        required: true

jobs:
  update-kubernetes-deployment:
    runs-on: ubuntu-latest
    env:
      K3S_REPO: "pipelinedave/k3s-config"
      VERSION_TAG: ${{ inputs.version_tag }}
      OVERLAY: ${{ inputs.overlay }}
    steps:
      - name: 📥 Checkout k3s-config Repo
        uses: actions/checkout@v4
        with:
          repository: ${{ env.K3S_REPO }}
          token: ${{ secrets.K3S_CONFIG_TOKEN }}
          ref: main
          fetch-depth: 0

      - name: 🔧 Configure Git
        run: |
          git config user.name "GitHub Actions [bot]"
          git config user.email "actions@github.com"
          git pull --rebase origin main

      - name: 📦 Set up Kustomize
        uses: imranismail/setup-kustomize@v2

      - name: 🚀 Update Image Tags in Overlay
        run: |
          echo "Updating all choretwo service images in overlay ${OVERLAY} to tag: ${VERSION_TAG}"
          OVERLAY_DIR="kustomize/choretwo/overlays/${OVERLAY}"
          
          if [ -d "$OVERLAY_DIR" ]; then
            cd "$OVERLAY_DIR"
            
            # Set images using kustomize
            kustomize edit set image pipelinedave/auth-service=pipelinedave/auth-service:${VERSION_TAG}
            kustomize edit set image pipelinedave/chore-service=pipelinedave/chore-service:${VERSION_TAG}
            kustomize edit set image pipelinedave/log-service=pipelinedave/log-service:${VERSION_TAG}
            kustomize edit set image pipelinedave/notification-service=pipelinedave/notification-service:${VERSION_TAG}
            kustomize edit set image pipelinedave/ai-copilot-service=pipelinedave/ai-copilot-service:${VERSION_TAG}
            kustomize edit set image pipelinedave/frontend=pipelinedave/frontend:${VERSION_TAG}
            
            cd -
          fi
          
          # Also update any explicit image lines in deployment manifests if present
          find "kustomize/choretwo/overlays/${OVERLAY}/" -name "*.yaml" -type f | while read file; do
            sed -i "s|image: pipelinedave/\([^:]*\):.*|image: pipelinedave/\1:${VERSION_TAG}|g" "$file"
          done

      - name: 💾 Commit & Push to k3s-config
        run: |
          git remote set-url origin "https://x-access-token:${{ secrets.K3S_CONFIG_TOKEN }}@github.com/${K3S_REPO}.git"
          git add kustomize/choretwo/
          
          if git diff --cached --quiet; then
            echo "No changes to commit (already at tag ${VERSION_TAG})."
          else
            git commit -m "chore(${OVERLAY}): update choretwo images to ${VERSION_TAG:0:7}"
            git push origin HEAD:main
            echo "Successfully updated and pushed image tags to k3s-config repo"
          fi

      - name: 🏷️ Push Tag in k3s-config Repo
        run: |
          TAG_NAME="choretwo/${OVERLAY}/${{ env.VERSION_TAG }}"
          git tag -f "${TAG_NAME}"
          git push origin -f "${TAG_NAME}" || echo "Tag push skipped or already up to date"
