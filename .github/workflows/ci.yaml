name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "20"
  GO_VERSION: "1.22"

jobs:
  test-auth:
    name: Test Auth Service (Go)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: services/auth-service/go.sum

      - name: Go Vet & Test
        working-directory: services/auth-service
        run: |
          go mod download
          go vet ./...
          go test -v -race ./...

  test-python-services:
    name: Test ${{ matrix.service }} (Python)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - chore-service
          - log-service
          - notification-service
          - ai-copilot-service
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
          cache-dependency-path: services/${{ matrix.service }}/requirements.txt

      - name: Install Dependencies & Linters
        working-directory: services/${{ matrix.service }}
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio httpx ruff

      - name: Lint with Ruff
        working-directory: services/${{ matrix.service }}
        run: |
          ruff check . --exit-non-zero-on-fix || true

      - name: Run Pytest
        working-directory: services/${{ matrix.service }}
        run: |
          PYTHONPATH=. pytest tests/ -v

  test-frontend:
    name: Test Frontend (Vue 3 / Vite)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        working-directory: frontend
        run: |
          npm ci

      - name: Run Unit Tests (Vitest)
        working-directory: frontend
        run: |
          npm test -- --run

      - name: Build Production Bundle
        working-directory: frontend
        run: |
          npm run build

  e2e-tests:
    name: Playwright E2E Tests
    runs-on: ubuntu-latest
    needs: [test-auth, test-python-services, test-frontend]
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies & Playwright Browsers
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium firefox

      - name: Run E2E Tests
        working-directory: frontend
        run: |
          npm run test:e2e || true

      - name: Upload Playwright Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 14
