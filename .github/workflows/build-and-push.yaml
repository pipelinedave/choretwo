name: Build and Push Docker Images

on:
  push:
    branches: [main, feat/monolith]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Custom tag for images (default: git sha)'
        required: false
        default: ''

env:
  DOCKER_REGISTRY: pipelinedave

jobs:
  build-and-push:
    name: Build & Push ${{ matrix.service.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          # Go auth-service (remains standalone)
          - name: auth-service
            context: ./services/auth-service
            dockerfile: ./services/auth-service/Dockerfile
          # Monolith: replaces chore-service, log-service, notification-service
          - name: monolith
            context: .
            dockerfile: ./monolith/Dockerfile
          # Frontend
          - name: frontend
            context: ./frontend
            dockerfile: ./frontend/Dockerfile
          # ai-copilot-service stays separate (resource-heavy)
          - name: ai-copilot-service
            context: ./services/ai-copilot-service
            dockerfile: ./services/ai-copilot-service/Dockerfile

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME || secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN || secrets.DOCKER_PASSWORD }}

      - name: Compute Image Tags
        id: meta
        run: |
          TAGS="${{ env.DOCKER_REGISTRY }}/${{ matrix.service.name }}:${{ github.sha }}"
          TAGS="${TAGS},${{ env.DOCKER_REGISTRY }}/${{ matrix.service.name }}:latest"
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            REF_TAG="${GITHUB_REF#refs/tags/}"
            TAGS="${TAGS},${{ env.DOCKER_REGISTRY }}/${{ matrix.service.name }}:${REF_TAG}"
          fi
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            TAGS="${TAGS},${{ env.DOCKER_REGISTRY }}/${{ matrix.service.name }}:${{ github.event.inputs.tag }}"
          fi
          echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"

      - name: Build & Push Image
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.service.context }}
          file: ${{ matrix.service.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-production:
    name: Deploy to Production (GitOps Flux)
    needs: build-and-push
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    uses: ./.github/workflows/update-kubernetes-deployment.yaml
    with:
      overlay: production
      version_tag: ${{ github.sha }}
    secrets: inherit
