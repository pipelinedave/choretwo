name: Security Scanning

on:
  schedule:
    - cron: '0 0 * * 0'  # Weekly on Sundays
  push:
    branches: [main]
    paths:
      - '**/Dockerfile'
      - '**/package*.json'
      - '**/requirements*.txt'
      - '**/go.mod'
      - '**/go.sum'
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  dependency-check:
    name: Dependency Scanning (${{ matrix.service.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - name: auth-service
            path: services/auth-service
            type: go
          - name: chore-service
            path: services/chore-service
            type: python
          - name: log-service
            path: services/log-service
            type: python
          - name: notification-service
            path: services/notification-service
            type: python
          - name: ai-copilot-service
            path: services/ai-copilot-service
            type: python
          - name: frontend
            path: frontend
            type: node
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        if: matrix.service.type == 'python'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js
        if: matrix.service.type == 'node'
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set up Go
        if: matrix.service.type == 'go'
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Run pip-audit (Python)
        if: matrix.service.type == 'python'
        run: |
          pip install pip-audit
          cd ${{ matrix.service.path }}
          pip-audit -r requirements.txt || true

      - name: Run npm audit (Node)
        if: matrix.service.type == 'node'
        run: |
          cd ${{ matrix.service.path }}
          npm audit --audit-level=critical || true

      - name: Run govulncheck (Go)
        if: matrix.service.type == 'go'
        run: |
          cd ${{ matrix.service.path }}
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./... || true

  secret-scan:
    name: Secret Scanning
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
